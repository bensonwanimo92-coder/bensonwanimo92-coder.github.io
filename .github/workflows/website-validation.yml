name: SkyNest website validation

on:
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '.github/workflows/website-validation.yml'
  push:
    branches:
      - main
    paths:
      - '*.js'
      - '*.html'
      - '.github/workflows/website-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript module syntax
        run: |
          set -euo pipefail
          for file in app.js dashboard.js admin.js consent.js firebase-config.js; do
            node --input-type=module --check < "$file"
          done
      - name: Check required marketplace pages
        run: |
          test -s index.html
          test -s advertiser.html
          test -s admin.html
          test -s privacy.html
          grep -q 'mediaFiles' advertiser.html
          grep -q 'changes_requested' admin.js
          grep -q 'listing_media' dashboard.js
          grep -q 'publicListings' app.js
          grep -q 'PN9bC3ZzgSaOK1JjG4TcjCU9Grx1' admin.js
          grep -q 'emailVerified' dashboard.js
